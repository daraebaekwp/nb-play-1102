<!doctype html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="고양이">
<title>고양이를 키웠더니 맛보기</title>
<style>
  :root { --ink:#4a2c1a; --paper:#fbf4e6; }
  /* 글꼴: 모두 SIL OFL 1.1 (fonts/ 에 파일과 라이선스). 웹에서 불러오지 않음 */
  @font-face { font-family:'Gowun Dodum'; src:url(fonts/GowunDodum-Regular.woff2?v=158) format('woff2'); font-display:swap; }
  @font-face { font-family:'Gowun Batang'; src:url(fonts/GowunBatang-Regular.woff2?v=158) format('woff2'); font-display:swap; }
  @font-face { font-family:'Jua'; src:url(fonts/Jua-Regular.woff2?v=158) format('woff2'); font-display:swap; }
  @font-face { font-family:'Poor Story'; src:url(fonts/PoorStory-Regular.woff2?v=158) format('woff2'); font-display:swap; }
  @font-face { font-family:'Gaegu'; src:url(fonts/Gaegu-Regular.woff2?v=158) format('woff2'); font-display:swap; }
  @font-face { font-family:'Hahmlet'; src:url(fonts/Hahmlet-Regular.woff2?v=158) format('woff2'); font-display:swap; }
  :root { --f-body:'Hahmlet'; --f-paper:'Gowun Batang'; } /* 본문·UI 함렛, 일기·편지 종이 고운바탕, 대회 결과 큰 판 주아 */
  html,body { margin:0; height:100%; background:#111; overflow:hidden; font-family:var(--f-body),'Gowun Dodum',sans-serif; }
  #stage { position:absolute; left:50%; top:50%; width:min(100vw,177.78vh); height:min(56.25vw,100vh);
           transform:translate(-50%,-50%); overflow:hidden; user-select:none; container-type:size; background:#000; }
  .layer { position:absolute; inset:0; display:none; }
  .layer.on { display:block; }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  button { font-family:inherit; }

  /* 공통 부품 */
  .pb { font-size:1.5cqw; color:var(--ink); padding:.9cqh 3cqw; background:url(img/UI_선택지.png) center/100% 100% no-repeat; border:0; cursor:pointer; min-width:14cqw; }
  .pb:hover { filter:brightness(1.06) drop-shadow(0 0 10px rgba(255,226,150,.85)); }
  .pb[disabled] { filter:grayscale(.8) opacity(.5); cursor:default; }
  .frame { border:clamp(22px,2.6vw,40px) solid transparent; border-image:url(img/UI_대사창.png) 125 fill stretch; box-sizing:border-box; color:var(--ink); }
  .pt { border-radius:50%; background:#efe0c2; box-shadow:0 0 0 2px #8a5a36; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#8a5a36; font-size:1.1cqw; flex:none; }
  .pt img { width:100%; height:100%; object-fit:cover; }
  .pt.empty { background:rgba(122,78,48,.1); box-shadow:inset 0 0 0 2px rgba(122,78,48,.25); }

  /* 타이틀 */
  #title .logo { position:absolute; left:0; right:0; top:22%; text-align:center; color:#fff8ea; font-size:6cqw; letter-spacing:.08em;
                 text-shadow:0 4px 14px rgba(0,0,0,.7), 0 0 30px rgba(255,214,150,.5); }
  #title .sub { position:absolute; left:0; right:0; top:39%; text-align:center; color:#f6e3c6; font-size:1.6cqw; text-shadow:0 2px 6px rgba(0,0,0,.8); }
  #title .btns { position:absolute; left:0; right:0; top:56%; display:flex; flex-direction:column; align-items:center; gap:2cqh; }
  #title .dim { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.05), rgba(0,0,0,.55)); }

  /* 이름 */
  #names .panel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:46cqw; padding:3cqh 3cqw; display:flex; flex-direction:column; gap:2.4cqh; align-items:center; }
  #names h2 { margin:0; font-weight:400; font-size:2.2cqw; }
  #names label { width:100%; display:flex; flex-direction:column; gap:.8cqh; font-size:1.3cqw; }
  #names label small { opacity:.65; font-size:.95cqw; }
  #names input { font-family:inherit; font-size:1.8cqw; color:var(--ink); padding:.8cqh 1cqw; border-radius:10px; border:2px solid #8a5a36; background:#fffaf0; text-align:center; }

  /* 장면(대화) */
  #scene .ch { position:absolute; bottom:6%; transform-origin:50% 100%; opacity:0; transition:opacity .6s; }
  #scene .ch.on { opacity:1; }
  #scene .ch img { position:absolute; bottom:0; left:50%; transform:translateX(-50%); height:100%; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  #sL { height:72%; width:18%; left:31%; }
  #sR { height:66%; width:18%; left:51%; }
  #sR.kid { height:50%; } #sR.kid.k10 { height:45%; } /* 10/12밤: 10~11살은 언니 옆에서 더 작게(발은 바닥 그대로) */ #sR.kid.teen { height:59%; } #sR.kid.lady { height:66%; }
  #sC { height:72%; width:20%; left:40%; }
  #pom { position:absolute; left:70%; top:12%; width:8cqw; height:20cqh; opacity:0; transition:opacity 1s; pointer-events:none; }
  #pom.on img, #hpom img { pointer-events:auto; cursor:pointer; }
  .wiggle { animation:wiggle .6s ease !important; } @keyframes wiggle { 0%,100% { transform:none } 15% { transform:rotate(-12deg) scale(1.08,.92) } 30% { transform:rotate(10deg) scale(.94,1.06) } 45% { transform:rotate(-8deg) } 60% { transform:rotate(6deg) scale(1.04,.96) } 80% { transform:rotate(-3deg) } }
  #pom.on { opacity:1; }
  #pom img { width:100%; height:100%; object-fit:contain; animation:float 4.5s ease-in-out infinite; filter:drop-shadow(0 0 14px rgba(255,226,150,.85)); }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-8%) rotate(3deg)} }
  /* 대사창: 높이는 늘 두 줄 기준으로 고정(줄 수가 달라도 창이 출렁이지 않게). 줄바꿈은 글자를 찍기 전에 창 폭에 맞춰 미리 계산 */
  #sbox { position:absolute; left:23%; right:23%; bottom:4.5%; height:calc(3em + 2 * clamp(22px,2.6vw,40px) + .5em); z-index:5; border-radius:28px;
          display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:0 4%; box-sizing:border-box; font-size:clamp(16px,1.9cqw,27px); line-height:1.5; opacity:0; transition:opacity .25s; }
  #sbox::after { content:'▼'; position:absolute; right:.9em; bottom:.05em; font-size:.55em; color:#8a5a36; opacity:0; }
  #sbox.done::after { opacity:.7; animation:nextBlink 1.1s ease-in-out infinite; } @keyframes nextBlink { 50% { opacity:.2; transform:translateY(2px) } }
  #sname { display:none; }
  /* 큰 그림 장면: 종이 바탕 대신 위는 비치고 아래는 진한 바탕, 글자는 밝은 테두리로 또렷하게 */
  #scene.cgmode #sbox.frame.on { opacity:.9; } /* 10/12: 모양은 평소 대사창 그대로, 바탕만 조금 비치게 */
  /* 화면이 아주 좁을 때(휴대폰 세로): 얼굴 그림 대신 이름을 창 안에 쓰고, 창을 화면 폭에 맞춤 */
  #stage.narrow #sbox { left:2%; right:2%; bottom:2%; border-width:14px; padding:0 2.5%; font-size:16px; line-height:1.4; height:calc(3.9em + 28px); }
  #stage.narrow #sname { display:block; font-size:.78em; line-height:1.3; color:#8a4f22; } #stage.narrow #sname:empty { display:none; }
  #stage.narrow .por { display:none; }
  #schoices .pb { font-size:clamp(14px,1.5cqw,22px); }
  #sbox.frame { border-radius:0; }
  #sbox.on { opacity:1; }
  #sbox.inner { font-style:italic; color:#6b4a35; }
  #sline, #result .line, #toast { word-break:keep-all; overflow-wrap:break-word; white-space:pre-line; }
  #sline { white-space:pre; }
  .por { z-index:6; position:absolute; bottom:3%; width:19%; height:42%; opacity:0; transition:opacity .3s, filter .3s; pointer-events:none; }
  .por.on { opacity:1; } .por.dim { filter:brightness(.55); }
  .por img { position:absolute; bottom:9%; left:50%; transform:translateX(-50%); height:100%; }
  .por .plate { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:78%; aspect-ratio:4.2; display:flex; align-items:center; justify-content:center;
                background:url(img/UI_이름표.png) center/100% 100% no-repeat; color:var(--ink); font-size:clamp(13px,1.6vw,23px); white-space:nowrap; }
  #ptag { position:absolute; right:2%; width:19%; bottom:9.4%; z-index:7; text-align:center; font-size:1.25cqw; color:#fff6e4; text-shadow:0 1px 6px #000, 0 0 2px #000; letter-spacing:.04em; opacity:0; transition:opacity .6s; pointer-events:none; } #ptag.on { opacity:1; } /* 10/21 작가: 3년 뒤 직업 글씨는 일러 가리지 않게 동생 이름표 위에 작게 */
  #pL { left:2%; } #pR { right:2%; } .por .plate { width:70%; }
  .por.pomp img { height:62% !important; bottom:22% !important; top:auto !important; object-fit:contain; filter:drop-shadow(0 0 12px rgba(255,240,180,.9)); }
  #pR.kid img { height:100%; }
  #ttl { position:absolute; left:8%; right:8%; top:5%; text-align:center; color:#fff; font-size:clamp(16px,2.3vw,34px); z-index:6;
         text-shadow:0 2px 6px rgba(0,0,0,.85), 0 0 14px rgba(0,0,0,.6); opacity:0; transition:opacity .6s; }
  #ttl.on { opacity:1; }
  #schoices { position:absolute; left:24%; right:24%; bottom:47%; height:auto; display:none; flex-direction:column; align-items:center; justify-content:center; gap:1.4cqh; z-index:7; }
  #schoices.on { display:flex; }
  .shopsay { margin:.6cqh auto 0; max-width:56cqw; padding:.5cqh 1.2cqw; border-radius:12px; background:rgba(255,246,220,.9); box-shadow:0 0 0 1px #d8bc98; font-size:max(1.1cqw,12px); line-height:1.5; text-align:left; } .shopsay b { font-weight:400; color:#8a4f22; margin-right:.5em; }
  #schoices .pb { min-width:34cqw; }

  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .9s; z-index:30; }
  #fade.on { opacity:1; }
  #office { position:absolute; inset:0; background:#07080d; }
  #office .mon { position:absolute; left:34%; top:24%; width:32%; height:34%; border-radius:6px; background:linear-gradient(#9fc3ff,#5d7fb8); box-shadow:0 0 80px 30px rgba(120,160,255,.35); opacity:.85; }
  #office .desk { position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(#1a1410,#0b0806); }
  #office .key { position:absolute; left:63%; top:62%; font-size:3cqw; color:#ffe9a8; text-shadow:0 0 12px #ffd76a; transform-origin:50% 0; animation:swing 2.4s ease-in-out infinite; }
  @keyframes swing { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(12deg)} }
  #office.tilt { animation:tilt 2s ease-in forwards; }
  @keyframes tilt { to { transform:rotate(8deg) scale(1.1); filter:blur(3px) brightness(.4); } }
  .hint { position:absolute; right:3%; bottom:1.5%; color:rgba(255,255,255,.5); font-size:clamp(10px,1vw,14px); z-index:8; }

  /* 집 */
  #nabi { position:absolute; left:47%; bottom:17%; height:52%; transform:translateX(-50%); transform-origin:50% 100%; }
  #nabi img { height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); animation:breathe 4.5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform:translateY(-0.5%); } }
  #talk { position:absolute; left:62%; top:-6%; width:4.6cqw; aspect-ratio:1.25; border-radius:50% 50% 50% 12%; background:var(--paper); border:3px solid #5b3a24;
          box-shadow:0 3px 8px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; color:#5b3a24; font-size:2.2cqw; line-height:0; cursor:pointer; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-14%); } }
  #zzz { position:absolute; left:58%; top:-8%; font-size:1.4cqw; background:rgba(255,248,234,.92); color:#6b4a35 !important; text-shadow:none !important; padding:.3em .8em; border-radius:99px; box-shadow:0 2px 6px rgba(0,0,0,.25); color:#fff8ea; text-shadow:0 2px 4px rgba(0,0,0,.7); display:none; animation:bob 2.4s ease-in-out infinite; }
  #nabi.tired #zzz { display:block; } #nabi.tired #talk { display:none; }
  #nabi.tired img { filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)) saturate(.8) brightness(.92); }
  #hpom { position:absolute; left:20%; top:30%; width:7cqw; height:20cqh; pointer-events:none; }
  #hpom img { width:100%; height:100%; object-fit:contain; animation:float 4.5s ease-in-out infinite; filter:drop-shadow(0 0 12px rgba(255,226,150,.8)); }
  /* 집 화면 폼폼: 계절마다 다른 자리, 누르면 통 튀기, 세 번 누르면 도망, 오래 두면 굴러가기 (몸·팔다리 없이 부풀기·빛·움직임으로만) */
  #hpom { transition:left 1.2s ease, top 1.2s ease, transform 1s ease; } #hpom.rolling { transition:left 3.2s linear, top 1.2s ease; } #hpom.slow { transition:left 4s ease-in-out, top 4s ease-in-out; }
  #hpom img.hop { animation:pomHop .55s ease; } #hpom img.puff { animation:pomPuff .5s ease; } #hpom img.rolling { animation:pomRoll 3.2s linear; }
  @keyframes pomHop { 0%,100% { transform:translateY(0) scale(1) } 40% { transform:translateY(-22%) scale(1.06) } 70% { transform:translateY(0) scale(.97,1.03) } }
  @keyframes pomPuff { 0%,100% { transform:scale(1) } 35% { transform:scale(1.22) } } @keyframes pomRoll { from { transform:rotate(0) } to { transform:rotate(var(--rd,720deg)) } }
  #hpom.glow img { filter:drop-shadow(0 0 26px rgba(255,236,170,1)) brightness(1.15); transition:filter .6s; }
  .pomseed { position:absolute; left:60%; top:30%; width:.5cqw; height:.5cqw; border-radius:50%; background:#fffbe6; box-shadow:0 0 6px #fff3c4; pointer-events:none; animation:pomSeed 5s ease-out forwards; } @keyframes pomSeed { to { transform:translate(55cqw,-45cqh); opacity:0 } }
  body.still #hpom img.rolling { animation:none; }
  #date { position:absolute; left:1.5%; top:2.5%; width:27cqw; aspect-ratio:2.27; background:url(img/UI_날짜판.png) center/100% 100% no-repeat; }
  #date .m { position:absolute; left:2%; top:4%; width:41%; height:90%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink); }
  #date .m b { font-size:3.6cqw; line-height:1; font-weight:400; } #date .m small { font-size:1.3cqw; margin-top:.2em; }
  #date .t { position:absolute; left:50%; right:8%; top:20%; height:60%; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:.5cqh; color:var(--ink); line-height:1.25; }
  #date .t span { font-size:1.15cqw; opacity:.7; } #date .t strong { font-size:1.55cqw; font-weight:400; }
  #money { position:absolute; right:1.8%; top:3%; width:16cqw; aspect-ratio:2.16; background:url(img/UI_돈표시.png) center/100% 100% no-repeat;
           display:flex; align-items:center; justify-content:flex-end; padding-right:2.2cqw; box-sizing:border-box; color:var(--ink); font-size:2.2cqw; }
  #money img { position:absolute; left:-2.2cqw; top:50%; transform:translateY(-50%); width:5.6cqw; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  #stats { position:absolute; right:1.5%; top:15%; width:17cqw; height:66%; background:url(img/UI_능력치패널.png) center/100% 100% no-repeat;
           padding:5.5cqh 2.6cqw; box-sizing:border-box; color:var(--ink); display:flex; flex-direction:column; justify-content:center; gap:.9cqh; }
  #stats h3 { margin:0 0 .2cqh; font-weight:400; font-size:1.6cqw; text-align:center; }
  .stat { font-size:1.35cqw; } .stat .row { display:flex; justify-content:space-between; }
  .stat .bar { height:1cqh; border-radius:99px; background:rgba(91,58,36,.18); margin-top:.5cqh; overflow:hidden; }
  .stat .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#c98b4f,#a8643a); transition:width .6s; }
  .stat.up .row span:last-child { color:#3f7a2a; }
  #menu { position:absolute; left:50%; bottom:1.5%; transform:translateX(-50%); display:flex; gap:1.1cqw; z-index:5; }
  .mb { width:5.6cqw; display:flex; flex-direction:column; align-items:center; cursor:pointer; background:none; border:0; padding:0; }
  .mb img { width:100%; transition:transform .18s, filter .18s; filter:drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .mb span { margin-top:-.6cqh; font-size:1.2cqw; color:#fff8ea; background:rgba(60,36,20,.82); border:1px solid #b8925f; border-radius:99px; padding:.1em .8em; white-space:nowrap; position:relative; }
  .mb:hover img { transform:scale(1.1) translateY(-4%); filter:drop-shadow(0 0 10px rgba(255,226,150,.9)) drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .mb.soon { opacity:.55; } .mb.soon:hover img { transform:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .mb.glow img { animation:mglow 1.6s ease-in-out infinite; } @keyframes mglow { 50% { filter:drop-shadow(0 0 14px rgba(255,226,150,1)); transform:scale(1.08); } }
  #homeFatigue { position:absolute; right:1.5%; top:81%; width:17cqw; text-align:center; color:#fff8ea; font-size:1.1cqw;
                 background:rgba(60,36,20,.78); border:1px solid #b8925f; border-radius:14px; padding:.6cqh 0 .8cqh; z-index:4; }
  .paws { display:flex; gap:.35cqw; justify-content:center; margin-top:.5cqh; }
  .paw { width:1.9cqw; height:1.9cqw; }
  .paw path, .paw circle { fill:#d8c2a8; } .paw.on path { fill:#8a5a36; } .paw.on circle { fill:#e79aa6; }
  #homeFatigue .paw path, #homeFatigue .paw circle { fill:#6e5440; } #homeFatigue .paw.on path { fill:#f6e3c6; } #homeFatigue .paw.on circle { fill:#f3a6b4; }
  .fword { font-size:1.15cqw; text-align:center; margin-top:.3cqh; }
  #toast { position:absolute; left:50%; top:16%; transform:translateX(-50%); z-index:25; background:rgba(60,36,20,.9); color:#fff3dc; border:1px solid #b8925f;
           border-radius:12px; padding:1cqh 2cqw; font-size:1.3cqw; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.on { opacity:1; }
  #shade { position:absolute; inset:0; background:rgba(20,12,6,.35); display:none; z-index:9; } #shade.on { display:block; }

  /* 일정 */
  #plan { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%) scale(.96); width:80cqw; height:84cqh; z-index:10; padding:.6cqh 1.6cqw;
          opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; display:flex; flex-direction:column; }
  #plan.on { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  #plan h2 { margin:0; font-weight:400; font-size:2.3cqw; text-align:center; }
  #planbody { display:grid; grid-template-columns:1fr 14cqw; gap:1.4cqw; flex:1; min-height:0; margin-top:1.4cqh; }
  #weeks { display:grid; grid-template-columns:repeat(4,1fr); gap:.9cqw; }
  .wk { position:relative; border-radius:10px; height:11cqh; display:flex; align-items:center; gap:.7cqw; padding:0 .8cqw; box-sizing:border-box; cursor:pointer;
        background:rgba(255,250,238,.6); box-shadow:inset 0 0 0 2px rgba(122,78,48,.35); }
  .wk::before { content:attr(data-n); position:absolute; top:-1.1cqh; left:50%; transform:translateX(-50%); background:#6b4329; color:#f6e9d2; font-size:1cqw; padding:.12em .9em; border-radius:99px; white-space:nowrap; }
  .wk.sel { box-shadow:inset 0 0 0 3px #b9773f, 0 0 14px rgba(255,210,130,.7); background:rgba(255,238,200,.85); }
  .wk.full:hover::after { content:"한 번 더 누르면 빼기 · 오른쪽 클릭"; position:absolute; bottom:-2.6cqh; left:50%; transform:translateX(-50%); font-size:.85cqw; white-space:nowrap; color:#6b4329; }
  .wk .pt { width:8cqh; height:8cqh; } .wk .tx { display:flex; flex-direction:column; min-width:0; }
  .wk b { font-weight:400; font-size:1.3cqw; white-space:nowrap; } .wk small { font-size:.95cqw; opacity:.7; }

너 그거 다 봤어?","face":"시무룩"},{"who":"나비","text":"맨 앞줄 한가운데서 눈 똥그랗게 뜨고 지켜봤잖아.","face":"기본"},{"who":"밀로","text":"네가 바로 앞에서 꼬리 흔들며 보고 있으니까 심장이 더 떨렸단 말이야.","face":"기본"},{"who":"나비","text":"그래? 그럼 다음번 승급식 땐 제일 뒷줄로 숨을까?","face":"웃음"},{"who":"밀로","text":"아니! 무조건 맨 앞줄에 있어 줘.","face":"기본"},{"who":"나비","text":"밀로? 말하다 말고 갑자기 왜 그래?","face":"기본"},{"who":"나비","text":"…긴장 다 풀려서 벌써 바닥에 엎드려 자네.","face":"웃음"}]}]},{"id":"sp_hazel","name":"헤이즐","title":"내 빵집의 꿈","bgm":"28_헤이즐테마_A","hearts":20,"minAge":13,"maxAge":15,"after":"헤이즐4","scenes":[{"ttl":"깊은 밤, 빵집 창고 안","frames":["특별_헤이즐_1_1","특별_헤이즐_1_2","특별_헤이즐_1_3"],"cam":"slow-zoom-in","lines":[{"who":"나비","text":"헤이즐, 이 늦은 밤에 나를 왜 몰래 불렀어?"},{"who":"헤이즐","text":"쉿! 발소리 죽여, 동생들 깨면 오늘 계획 전부 끝장이야."},{"who":"나비","text":"…이거 과자 레시피 그림이야? 이걸 다 네가 직접 그린 거야?","face":"놀람"},{"who":"헤이즐","text":"식빵이나 바게트는 우리 부모님 거잖아."},{"who":"헤이즐","text":"아기자기하고 달콤한 과자는 오롯이 내 것으로 만들고 싶어."},{"who":"나비","text":"저번엔 빵집 가업 잇기 싫다고 투정 부렸잖아."},{"who":"헤이즐","text":"부모님 빵집 물려받는 건 싫지만, 내 이름을 건 과자 가게는 완전히 다른 얘기지!"}]},{"ttl":"한밤중, 온기 도는 빵집 부엌","frames":["특별_헤이즐_2_1","특별_헤이즐_2_2","특별_헤이즐_2_3"],"cam":"still","lines":[{"who":"헤이즐","text":"도토리 가루 가득 한 컵, 설탕 듬뿍 두 숟갈."},{"who":"나비","text":"내가 도토리 가루 한 컵 팍팍 넣었어!","face":"웃음"},{"who":"헤이즐","text":"…잠깐, 그거 반죽용 커다란 계량 컵이잖아!","face":"놀람"},{"who":"나비","text":"컵 크기가 두 종류인 줄 고양이가 어떻게 알아!","face":"놀람"},{"who":"헤이즐","text":"어쩔 수 없지, 다른 재료도 전부 세 배씩 더 넣으면 돼!"},{"who":"나비","text":"그럼 구워져 나오는 과자도 세 배로 많아지는 거야?"},{"who":"헤이즐","text":"응, 무려 세 판이야! 동틀 때까지 다 구워 버리자!"}]},{"ttl":"새벽녘, 은은하게 타오르는 화덕 앞","frames":["특별_헤이즐_3_1","특별_헤이즐_3_2","특별_헤이즐_3_3"],"cam":"pan-left","lines":[{"who":"헤이즐","text":"…첫 번째 판은 딱딱해서 거의 돌멩이 수준이네.","face":"시무룩"},{"who":"나비","text":"식탁에 탁탁 두드리니까 진짜 돌 소리 나!"},{"who":"헤이즐","text":"두 번째 판은 타이밍 놓쳐서 새까맣게 탔고…","face":"시무룩"},{"who":"나비","text":"근데 세 번째 판은… 겉은 바삭하고 속은 폭신해! 엄청 달고 맛있어!","face":"웃음"},{"who":"헤이즐","text":"후후, 이 완벽한 과자는 손님한테 동전 한 닢 받을 거야."},{"who":"나비","text":"난 주머니에 반짝이는 단추밖에 없는데 어떡해?"},{"who":"헤이즐","text":"너한테는 단추도 소중하게 받아 줄게. 내 평생의 첫 손님이니까!"}]}]},{"id":"sp_ruby","name":"루비","title":"엄마 가게의 위기","bgm":"29_루비테마_A","hearts":20,"minAge":13,"maxAge":15,"after":"루비4","scenes":[{"ttl":"안개 낀 새벽, 꽃 가게 앞","frames":["특별_루비_1_1","특별_루비_1_2","특별_루비_1_3"],"cam":"shake-small","lines":[{"who":"나비","text":"루비! 이 새벽에 혼자 멍하니 서서 뭐 해?","face":"놀람"},{"who":"루비","text":"…도와주러 온다던 네가 늦게 오니까 기다렸잖아.","face":"기본"},{"who":"나비","text":"아직 해도 안 떴는데 어떻게 더 일찍 와!","face":"기본"},{"who":"루비","text":"큰 장날 새벽은 해 뜨는 것보다 훨씬 부지런해야 해.","face":"기본"},{"who":"나비","text":"꽃 가게 어머니는 어디 가셨어?","face":"기본"},{"who":"루비","text":"옆 마을로 새 가게 자리 알아보러 일찍 가셨어.","face":"시무룩"},{"who":"나비","text":"…","face":"기본"},{"who":"루비","text":"…새벽이슬 맞아서 신발 다 젖었잖아, 늦잠 잔 네 탓이야.","face":"시무룩"}]},{"ttl":"아침, 활기찬 장터","frames":["특별_루비_2_1","특별_루비_2_2","특별_루비_2_3"],"cam":"still","lines":[{"who":"나비","text":"예쁘고 싱싱한 꽃 사세요! 방금 이슬 털어 온 꽃이에요!","face":"웃음"},{"who":"루비","text":"…꽃 사 가세요.","face":"기본"},{"who":"나비","text":"루비, 손님 오시는데 입꼬리 올리고 좀 살갑게 웃어 봐!","face":"기본"},{"who":"루비","text":"…이렇게 어색하게 웃으면 돼?","face":"기본"},{"who":"나비","text":"…아니다. 넌 그냥 가만히 서 있는 게 낫겠다.","face":"놀람"},{"who":"루비","text":"저기 손님! 꽃줄기를 거꾸로 쥐면 꽃잎 다 상해요!","face":"놀람"},{"who":"루비","text":"이리 줘 보세요. 줄기 아래쪽을 이렇게 살살 감싸 쥐는 거예요.","face":"기본"},{"who":"나비","text":"…꽃 사러 온 손님한테 잔소리하면 어떡해.","face":"놀람"}]},{"ttl":"따스한 한낮, 꽃수레 위","frames":["특별_루비_3_1","특별_루비_3_2","특별_루비_3_3"],"cam":"slow-zoom-in","lines":[{"who":"루비","text":"줄기 끝을 사선으로 비스듬히 잘라 꽂아야 물을 잘 먹어서 오래가요.","face":"기본"},{"who":"루비","text":"화병 물은 매일 아침마다 갈아 주시고요. …제 설명 제대로 듣고 계시죠?","face":"기본"},{"who":"나비","text":"루비야 뒤를 좀 봐, 손님들이 구름처럼 줄 섰어!","face":"놀람"},{"who":"루비","text":"…줄을 섰다고?","face":"놀람"},{"who":"나비","text":"너한테 꽃 오래 피우는 비결 물어보려고 다들 꽃 한 다발씩 들고 기다리잖아!","face":"기본"},{"who":"루비","text":"…그럼 순서대로 한 분씩 꽃부터 골라 오세요!","face":"기본"},{"who":"나비","text":"동전 통이 넘쳐서 짤랑거려!","face":"웃음"},{"who":"루비","text":"쉿, 손님들 보는 앞에서 동전 세는 거 아니야!","face":"기본"}]},{"ttl":"저녁, 꽃 가게 앞","frames":["특별_루비_4_1","특별_루비_4_2","특별_루비_4_3"],"cam":"pan-right","lines":[{"who":"나비","text":"와, 꽃수레에 딱 한 송이 남기고 전부 다 팔렸어!","face":"기본"},{"who":"루비","text":"이건 안 팔아. 고생하고 오실 우리 엄마 드릴 거야.","face":"기본"},{"who":"루비","text":"…이러면 엄마도 옆 마을로 이사 가자는 상자 다시 풀겠지.","face":"놀람"},{"who":"나비","text":"…","face":"웃음"},{"who":"루비","text":"…너 아침부터 웃으면서 손님 부른 거, 오늘 꽤 쓸모 있었어.","face":"기본"},{"who":"나비","text":"칭찬치고는 쑥스러워하기는, 시끄러워!","face":"웃음"},{"who":"루비","text":"그 시끄럽다는 말은 원래 내 전용 대사란 말이야!","face":"놀람"},{"who":"루비","text":"…수레 마당에 그대로 둬. 내일 장날에도 둘이 같이 끌고 나가야 하니까.","face":"기본"}]}]},{"id":"sp_molly","name":"몰리","title":"첫 발표회","bgm":"30_몰리테마_A","hearts":20,"minAge":13,"maxAge":15,"after":"몰리4","month":11,"scenes":[{"ttl":"저녁 무렵, 강당 무대 뒤 좁은 통로","frames":["특별_몰리_1_1","특별_몰리_1_2","특별_몰리_1_3"],"cam":"shake-small","lines":[{"who":"나비","text":"몰리, 엉덩이로 액자 좀 더 힘껏 밀어 봐!","face":"기본"},{"who":"몰리","text":"…캔버스가 너무 커서 문틈에 꽉 끼었어, 안 들어가.","face":"시무룩"},{"who":"나비","text":"눕히지 말고 옆으로 비스듬히 세워 보자!","face":"기본"},{"who":"몰리","text":"…","face":"기본"},{"who":"몰리","text":"…그냥 발표 안 하고 조용히 집에 갈까.","face":"시무룩"},{"who":"나비","text":"그림이 문틈에 끼어 버렸는데 그냥 가면 어떡해!","face":"기본"},{"who":"몰리","text":"…발표할 그림 제목도 세 글자나 돼서 너무 긴데.","face":"시무룩"},{"who":"나비","text":"또 커튼 뒤로 숨었네, 얼른 나와!","face":"기본"}]},{"ttl":"무대 커튼 뒤","frames":["특별_몰리_2_1","특별_몰리_2_2","특별_몰리_2_3"],"cam":"slow-zoom-in","lines":[{"who":"몰리","text":"…객석에 우리 할머니 오셨어.","face":"놀람"},{"who":"나비","text":"둘째 줄 가운데 자리! 손에 고운 손수건 꼭 쥐고 계셔.","face":"기본"},{"who":"몰리","text":"…벌써 눈물 글썽이셔?","face":"시무룩"},{"who":"나비","text":"아직 안 우셔, 콧물만 훌쩍 푸셨어.","face":"웃음"},{"who":"나비","text":"내 소매 그렇게 세게 붙잡으면 다 늘어나잖아.","face":"기본"},{"who":"몰리","text":"…떨려서 그랬어, 미안.","face":"시무룩"},{"who":"나비","text":"소매 말고 내 손 꼭 쥐어.","face":"기본"},{"who":"몰리","text":"…손바닥에 땀 많이 났는데.","face":"시무룩"}]},{"ttl":"스포트라이트 쏟아지는 무대 위","frames":["특별_몰리_3_1","특별_몰리_3_2","특별_몰리_3_3"],"cam":"still","lines":[{"who":"몰리","text":"…이 그림의, 제목은요.","face":"기본"},{"who":"몰리","text":"…","face":"기본"},{"who":"나비","text":"…","face":"기본"},{"who":"몰리","text":"…잠시만 기다려 주세요.","face":"기본"},{"who":"나비","text":"(속삭이며) 덮어둔 천 모서리가 액자에 살짝 걸렸어, 내가 걷어 줄게.","face":"놀람"},{"who":"몰리","text":"…!","face":"놀람"},{"who":"몰리","text":"…〈내 친구〉예요.","face":"기본"},{"who":"몰리","text":"…이상으로 발표 끝입니다.","face":"기본"}]},{"ttl":"별빛 내리는 밤, 학교 돌계단","frames":["특별_몰리_4_3"],"cam":"pan-left","lines":[{"who":"몰리 할머니","text":"우리 몰리, 계단 미끄러우니 천천히 내려오렴."},{"who":"몰리","text":"…계단 난간 잡은 손이 아직도 미끄러워요.","face":"시무룩"},{"who":"나비","text":"긴장해서 땀나서 그래. 나도 꼬리에 땀났잖아.","face":"기본"},{"who":"몰리","text":"…","face":"기본"},{"who":"몰리","text":"…내년 발표회 때도 무대 옆에서 내 손 잡아 줘.","face":"기본"},{"who":"나비","text":"당연하지! 내년엔 이것보다 캔버스 훨씬 더 크게 그릴 거야?","face":"웃음"},{"who":"몰리","text":"…응, 네 모습 전신 다 들어가게 크게 그릴래.","face":"기본"}]}]},{"id":"sp_kyle","name":"카일","title":"다리 밑 아이들","bgm":"32_카일테마_A","hearts":20,"minAge":13,"maxAge":15,"after":"카일4","scenes":[{"ttl":"해 질 녘, 물소리 들리는 돌다리 아래","frames":["특별_카일_1_1","특별_카일_1_2","특별_카일_1_3"],"cam":"slow-zoom-in","lines":[{"who":"카일","text":"…설마 했는데 빈손 안 되고 진짜 왔냐, {나비}."},{"who":"나비","text":"내가 온다고 약속했잖아. 빵 품에 꼭 품고 와서 아직 따끈따끈해!"},{"who":"카일","text":"목소리 낮춰, 조용히 해. 꼬맹이들 칭얼거리다 이제 겨우 잠들었단 말이야."},{"who":"꼬맹이들","text":"와아, 빵 냄새다! 빵이다 빵!"},{"who":"카일","text":"…고소한 냄새 귀신같이 맡고 죄다 일어났네."},{"who":"나비","text":"밀지 말고 차례차례 줄 서! 한 사람당 큼직한 빵 하나씩 골고루 줄 거야!","face":"웃음"},{"who":"카일","text":"내가 줄 서라고 할 땐 들은 척도 안 하더니."}]},{"ttl":"돌다리 밑 어둑한 안쪽","frames":["특별_카일_2_1","특별_카일_2_2","특별_카일_2_3"],"cam":"still","lines":[{"who":"카일","text":"…잠깐, 네 등 뒤에 서 있는 저 어른은 누구야?"},{"who":"나비","text":"우리 언니야. 내가 맛있는 거 같이 챙겨 오자고 불렀어."},{"who":"카일","text":"어른들한테 여기 소문나면 애들 다 쫓겨나고 뿔뿔이 흩어진단 말이야!"},{"who":"언니","text":"목마른데 마른 빵만 먹으면 목메잖아. 따뜻하게 마실 채소 수프 끓여 왔어."},{"who":"카일","text":"…냄비에서 살짝 탄내 나는 것 같은데."},{"who":"나비","text":"우리 언니가 끓인 수프는 원래 불맛이 나서 다 그래!"},{"who":"언니","text":"…냄비 바닥만 살짝 눌어붙은 거야, 먹는 덴 지장 없어.","face":"가슴"}]},{"ttl":"귀뚜라미 우는 밤, 다리 밑 평상","frames":["특별_카일_3_1","특별_카일_3_2","특별_카일_3_3"],"cam":"pan-left","lines":[{"who":"언니","text":"카일, 서 있지 말고 이리 와. 네 몫도 넉넉히 떠 놨어."},{"who":"카일","text":"난 생각 없으니까 됐어. 어린애들 먼저 배불리 먹여."},{"who":"언니","text":"꼬맹이들은 벌써 그릇 싹 비우고 두 그릇 겁이 많다. 물을 먹여 봐라.", "천천히 다가갔더니 손바닥에서 물을 마셨어요.", "…망아지가 너를 믿는군. 잘했다."], ["내일 기사단 행진이다. 말 장식을 맡긴다.", "말갈기를 땋고 방울을 달았어요!", "훌륭하다. 행진 맨 앞에 세우겠다."]], "대장간 풀무질": [["불이 약하다. 풀무를 일정하게.", "하나, 둘, 하나, 둘! 불이 빨개졌어요!", "그 박자다."], ["편자 열 개를 식혀서 늘어놔라. 뜨거우니 집게로.", "집게로 하나씩, 다 늘어놨어요.", "손 하나 안 데었군. 좋다."], ["기사 검을 하나 벼린다. 불 조절을 맡긴다.", "불을 계속 똑같이 지켰어요. 숨도 참았어요!", "…좋은 검이 나왔다. 네 몫도 있다."]], "여관 서빙": [["점심 손님이 몰렸어. 수프 여섯 그릇, 한 번에 나를 수 있겠니?", "쟁반에 여섯 그릇! 한 방울도 안 흘렸어요.", "와, 우리 여관 직원보다 낫네!"], ["단체 손님이 왔어. 누가 뭘 시켰는지 외워 볼래?", "창가 세 분은 생선, 문 쪽 두 분은 고기 스튜예요.", "하나도 안 틀렸어! 손님들이 놀라더라."], ["오늘 밤 여관에서 작은 잔치가 있어. 식탁 차리는 걸 맡아 줄래?", "초 열두 개 켜고 꽃도 놓았어요!", "이렇게 예쁜 식탁은 처음이야. 고마워."]], "극장 무대 보조": [["막이 오를 때 종을 한 번 쳐 줄래요? 딱 신호에 맞춰서요.", "땡! 신호 딱 맞았어요?", "완벽했어요. 배우들이 웃었어요."], ["배우 한 명이 왕관 소품을 잃어버렸대요. 찾아 줄래요?", "의상 상자 밑에 있었어요!", "살았어요. 공연 못 할 뻔했네요."], ["오늘 조명을 맡아 볼래요? 마지막 장면은 달빛처럼요.", "등불에 파란 천을 씌웠어요. 달빛 같아요?", "…관객들이 숨을 멈췄어요. 정말 멋졌어요."]], "약방 조수": [["이 약초를 곱게 빻거라. 너무 세게 말고.", "가루가 밀가루처럼 고와졌어요.", "그래, 그 정도다."], ["감기 환자가 왔다. 약봉지를 하루 세 번 치로 싸 보거라.", "아침, 점심, 저녁. 봉지에 해랑 달도 그려 놨어요.", "허허, 아이 환자도 헷갈리지 않겠구나."], ["밤에 열나는 아이가 있다. 내가 없을 때 약을 챙겨 줄 수 있겠느냐?", "물수건 얹고 약 먹였어요. 열이 내렸어요.", "…이제 너를 조수라고만 부르기 아깝구나."]], "왕궁 기록 필사": [["이 기록은 백 년 된 거라 종이가 약해요. 조심해서 옮겨 적어 줄래요?", "한 장도 안 찢고 다 옮겼어요.", "글씨도 반듯하네요. 고마워요."], ["지워진 글자가 몇 개 있어요. 앞뒤를 읽고 맞혀 볼래요?", "'겨울 축제에 고래가 왔다' 같아요!", "…맞아요. 다른 기록에도 그렇게 써 있어요."], ["왕실 연회 초대장을 써야 해요. 스무 장, 맡겨도 될까요?", "스무 장 다 썼어요. 금색 잉크로요.", "왕궁에서 제일 예쁜 초대장이에요."]], "숲 길잡이": [["안개가 짙은 날이야. 손님들 앞에서 등불을 들어 줄래?", "한 명도 안 놓치고 입구까지 왔어요.", "좋아. 손님들이 마음 놓더라."], ["길에 나무가 쓰러졌대. 돌아가는 길 알겠니?", "개울 따라 내려가면 돼요. 이끼 낀 바위 쪽으로요.", "허, 나도 그 길은 생각 못 했네."], ["이번 손님은 약초 학자야. 숲 깊은 데까지 가야 해.", "달빛꽃 핀 데까지 안내했어요. 학자님이 공책을 다 썼대요.", "이제 이 숲에서 네가 최고 길잡이다."]], "뒷골목 심부름": [["이 쪽지, 아무한테도 보이지 말고 빵집 뒷문에 놓고 와.", "아무도 못 봤어요. 고양이 걸음으로 다녀왔어요.", "킥킥, 발소리가 하나도 안 나더군."], ["골목 끝 상자, 경비가 오기 전에 옮겨 줘.", "경비가 모퉁이 돌 때 딱 맞춰 옮겼어요.", "킥킥, 눈치가 빠르네. 마음에 들어."], ["오늘은 큰일이야. 지붕 위로 가서 이 꾸러미를 전해 줘.", "지붕 세 개 건너서 전했어요. …근데 이거 뭐예요?", "킥킥, 모르는 게 약이야. 수고했어."]]};
const JOB_BOSS = {"우편 배달": "우체국장", "여관 서빙": "여관 주인", "숲 길잡이": "사냥꾼", "뒷골목 심부름": "수상한 족제비"};
  if (S.raiseNext) { const r = S.raiseNext; S.raiseNext = null; const keep = bgmKey; $('#plan').style.visibility = 'hidden';

    runScene([ { noIntro:true, soft:pic, ttl:`${r.n} · 고단한 일 끝나고`, L:null, R:null, pom:false },
      ...(q ? [ { ttl:'', who:boss, text:q[0] }, { who:'나비', text:q[1], face:'웃음' }, { who:boss, text:q[2] } ]
            : [ { ttl:'', who:boss, text:`${S.sis}${hasBatchim(S.sis)?'아':'야'}, 수고했어. 잠깐 이리 좀 와 볼래?` }, { who:boss, text:L } ]), { who:boss, text:'그래서 말인데, 네가 하도 열심히 해서 다음 주부터 일당을 조금 더 올려 줄게.' },
      { who:'나비', text: r.lv >= 3 ? '…진짜요?! 언니한테 달려가서 자랑해야지!' : '정말요? 감사합니다! 더 열심히 할게요!', face:'웃음' },
      { fn:() => { try { sfx('great'); } catch (e) {} toast(`두둑하게 ${r.n} 일당이 올랐어요! (+${r.lv * 15}%)`); }, who:boss, text: r.lv >= 3 ? '넌 우리 가게 보물이니까, 앞으로도 잘 부탁해.' : '몸 안 다치게 앞으로도 잘 부탁한다.' } ],
      () => { show('home'); $('#plan').style.visibility = ''; playBgm(keep); advanceWeek(); }); return; }
  if (S.demoNext && !location.hash.startsWith('#dev-sim-x')) { const [dn, dt] = String(S.demoNext).split('|'); S.demoNext = null; const ds = demoSteps(dn, +dt || 1); if (ds) { const keep = bgmKey; $('#plan').style.visibility = 'hidden'; runScene(ds, () => { show('home'); $('#plan').style.visibility = ''; playBgm(keep); advanceWeek(); }); return; } }
  if (S.runeNext) { S.runeNext = 0; S.seen['루네첫'] = 1; logIt('마법 수업 도중에 조용한 루네를 만났어요.'); const keep = bgmKey; $('#plan').style.visibility = 'hidden';

/*LORE_BEGIN*/const LORE_DATA = [{"id": "설정_귀_두개", "log": "고양이 귀는 기분까지 알아챈다는 걸 알았어요.", "cond": {"minAge": 10, "maxAge": 10}, "pom": false, "lines": [{"who": "언니", "text": "(…아직도 머리 위가 간질간질하다. 귀가 네 개라니.)", "inner": true}, {"who": "나비", "text": "언니, 왜 자꾸 고양이 귀 만져? 아직 열 남았어?", "face": "놀람"}, {"who": "언니", "text": "아니, 그냥. …사람 귀랑 고양이 귀 중에 어느 쪽이 먼저 쫑긋하나 보려고."}, {"who": "나비", "text": "고양이 귀지, 그걸 왜 물어. 언니 아직 덜 나았나 보다.", "face": "웃음"}, {"who": "언니", "text": "그럼 지금 내 기분도 알아?"}, {"who": "나비", "text": "응. 언니 지금 배고프지?", "face": "웃음"}, {"who": "언니", "text": "(…맞혔다. 고양이 귀는 기분까지 알아채는구나.)", "inner": true}]}, {"id": "설정_모모_탑", "log": "모모가 루네 선생님 탑에 산다는 얘기를 들었어요.", "cond": {"met": ["모모"], "minAge": 10, "maxAge": 14}, "pom": false, "lines": [{"who": "나비", "text": "언니, 모모는 루네 선생님이 사는 탑에 산대. 꼭대기 바로 아래 방이 모모 방이래.", "face": "웃음"}, {"who": "언니", "text": "토끼가 왜 사슴 집에 같이 살아?"}, {"who": "나비", "text": "그래서 물어봤는데, 소문 낼 거냐고 되물어서 더 못 물어봤어.", "face": "기본"}, {"who": "언니", "text": "(…묻지 않는 것도 모모한테는 이번이 처음이겠다.)", "inner": true}]}, {"id": "설정_모모_수프", "log": "모모네 저녁은 삼백 년째 당근 수프래요.", "cond": {"met": ["모모"], "minAge": 10, "maxAge": 16}, "pom": false, "lines": [{"who": "나비", "text": "모모가 그러는데 루네 선생님은 요리를 못해서 당근 수프밖에 못 끓인대. 무려 삼백 년 동안!", "face": "웃음"}, {"who": "언니", "text": "삼백 년이나 끓였으면 엄청 맛있어졌겠다."}, {"who": "나비", "text": "아니, 하나도 안 맛있대. 그래서 모모가 맨날 우리 집 생선 굽는 냄새 얘기만 해.", "face": "웃음"}, {"who": "언니", "text": "…그거 살짝 탄 냄새일 텐데.", "face": "웃음"}]}, {"id": "설정_모모_부모", "log": "모모 부모님 이야기를 처음 들었어요.", "cond": {"met": ["모모", "루네"], "minAge": 13, "maxAge": 14}, "pom": false, "lines": [{"who": "나비", "text": "오늘 학교에서 가족 그림 그렸는데, 모모는 루네 선생님하고 자기 둘만 딱 그렸어.", "face": "기본"}, {"who": "언니", "text": "…"}, {"who": "나비", "text": "다른 애들이 엄마 아빠는 어디 있냐고 물으니까, 엉뚱한 소문 열 개를 한꺼번에 떠들더라.", "face": "기본"}, {"who": "언니", "text": "(…자세히 묻지 말자. 모모가 먼저 말하고 싶어질 때까지.)", "inner": true}]}, {"id": "설정_루네_나이", "log": "루네 선생님이 삼백 살이 넘었다는 걸 알았어요.", "cond": {"met": ["루네"], "minAge": 11, "maxAge": 13}, "pom": false, "lines": [{"who": "나비", "text": "언니, 오울 선생님이 글쎄 루네 선생님한테 깍듯이 '선생님' 하고 부르던데? 오울 선생님 수염이 훨씬 할아버지잖아.", "face": "놀람"}, {"who": "언니", "text": "루네 씨가 삼백 살이 넘었다고 네가 말했잖아."}, {"who": "나비", "text": "아, 맞다! 그럼 오울 선생님이 아기인 거네!", "face": "웃음"}, {"who": "언니", "text": "(…이 포근숲 마을 사람들은 얼굴만 봐선 도저히 나이를 못 맞추겠다니까.)", "inner": true}]}, {"id": "설정_루네_등불_수업", "log": "루네 선생님 뿔 등불이 왜 있다 없다 하는지 들었어요.", "cond": {"met": ["루네"], "minAge": 11, "maxAge": 14}, "pom": false, "lines": [{"who": "나비", "text": "언니, 루네 선생님 뿔에 달린 등불 있잖아. 그거 정해진 날이 없대. 그날그날 기분 따라 다는 것 같아.", "face": "웃음"}, {"who": "언니", "text": "기분 따라?"}, {"who": "나비", "text": "응. 어제는 두 개였는데 오늘은 하나도 없었어. 모모 말로는 두 개 다는 날은 엄청 좋은 날이래.", "face": "웃음"}, {"who": "언니", "text": "(…그럼 하나도 없는 날은 뭐지.)", "inner": true}]}, {"id": "설정_루네_등불_밤", "log": "밤에 별빛 언덕에서 등불 하나가 내려오는 걸 봤어요.", "cond": {"met": ["루네"], "minAge": 11, "season": "겨울"}, "pom": false, "lines": [{"who": "언니", "text": "아까 장 보고 집에 오는데, 언덕에서 불 하나가 엄청 천천히 내려오더라."}, {"who": "나비", "text": "아, 그거 루네 선생님이야. 기분 좋은 날엔 뿔에 등불을 달고 다니시거든.", "face": "기본"}, {"who": "언니", "text": "아주 천천히 내려오던데, 느려서 그런 건가."}, {"who": "나비", "text": "응. 모모는 밖에서 놀다가도 탑 문 앞에 그 등불이 켜지면 저녁 시간인 걸 알고 뛰어 들어간대.", "face": "웃음"}]}, {"id": "설정_사슴족_귀", "log": "사슴족은 마력이 강해서 전설 속 동물에 더 가깝다는 걸 들었어요.", "cond": {"met": ["루네"], "minAge": 12, "maxAge": 16}, "pom": true, "lines": [{"who": "나비", "text": "언니, 루네 선생님은 귀가 사슴 귀 하나씩뿐이잖아. 우리는 사람 귀랑 고양이 귀 둘 다 있는데. 볼 때마다 신기해.", "face": "기본"}, {"who": "언니", "text": "응. 그래서 루네 씨 앞에선 다들 목소리가 작아지잖아."}, {"who": "폼폼", "text": "사슴족은 마력이 아주 강하거든. 그래서 아직 전설 속 동물에 더 가까워. 귀도 동물 귀 쪽이 남은 거야."}, {"who": "나비", "text": "모모가 그러는데, 루네 선생님은 한 귀로 말도 듣고 기분까지 다 알아챈대. 거짓말하면 바로 안대!", "face": "웃음"}, {"who": "언니", "text": "(…루네 씨 앞에선 말 조심해야겠다.)", "inner": true}]}, {"id": "설정_로완_왕자", "log": "도서관의 그 애가 왕자라는 걸 모모한테 들었어요.", "cond": {"met": ["로완", "모모"], "minAge": 10, "maxAge": 11, "notSeen": ["로완_왕궁첫만남"]}, "pom": false, "lines": [{"who": "나비", "text": "언니, 읽기 수업이랑 도서관에서 보는 로완 있잖아. 모모가 그러는데 로완이 글쎄 왕자래! 진짜 궁에 사는 왕자!", "face": "놀람"}, {"who": "언니", "text": "…어?! (왕자가 혼자 도서관에 다닌다고?)", "face": "가슴"}, {"who": "나비", "text": "근데 내가 로완한테 직접 물으니까 그냥 '…그래. 그러든가.' 하고 하던 책만 계속 읽었어.", "face": "기본"}, {"who": "언니", "text": "(…거창한 왕자님이 아니라, 그냥 편안한 로완으로 있고 싶은 거구나.)", "inner": true}]}, {"id": "설정_로완_장날", "log": "로완이 궁 밖에 나오는 날을 알았어요.", "cond": {"met": ["로완"], "minAge": 11, "maxAge": 15}, "pom": false, "lines": [{"who": "나비", "text": "로완은 장날 오후에만 딱 궁 밖에 나올 수 있대. 그때가 시녀장이 장 보러 가는 날이거든.", "face": "웃음"}, {"who": "언니", "text": "그렇게 나오기가 힘든 거야?"}, {"who": "나비", "text": "응. 그래서 로완은 장날만 되면 아침 일찍부터 창문 밖만 목 빠지게 쳐다본대.", "face": "웃음"}, {"who": "언니", "text": "(…다음 장날엔 빵이라도 좀 넉넉히 사 둬야겠다.)", "inner": true}]}, {"id": "설정_휴고_로완", "log": "휴고 장군이 로완을 돌본다는 걸 알았어요.", "cond": {"met": ["휴고", "로완"], "seen": ["휴고A"], "minAge": 13, "maxAge": 15}, "pom": false, "lines": [{"who": "나비", "text": "오늘 검술 훈련 끝나고 휴고 장군님이 로완 숙제를 꼼꼼하게 봤어. 왕님 대신이래.", "face": "기본"}, {"who": "언니", "text": "훈련하는 장군님이 숙제까지 봐준다고?"}, {"who": "나비", "text": "응. 로완이 틀린 데를 짚으면서 '…전하, 자세.' 그러셨어. 숙제 검사인데!", "face": "웃음"}, {"who": "언니", "text": "(…이것도 수첩에 적어 두겠습니다, 하시겠네.)", "face": "웃음", "inner": true}]}, {"id": "설정_밀로_목검", "log": "밀로가 목검을 베고 잔다는 걸 알았어요.", "cond": {"met": ["밀로"], "minAge": 10, "maxAge": 13}, "pom": false, "lines": [{"who": "나비", "text": "밀로는 잠잘 때 꼭 목검을 머리에 베고 잔대. 한밤중에 도둑 오면 꼬리 흔들 새도 없이 바로 잡으려고!", "face": "웃음"}, {"who": "언니", "text": "밤만 되면 꾸벅꾸벅 잠든다고 네가 그랬잖아."}, {"who": "나비", "text": "응, 맞아. 그래서 아침에 눈 떠보면 목검이 매일 침대 밑에 굴러다닌대. 매일!", "face": "웃음"}, {"who": "언니", "text": "…그래도 매일 베고 자는 건 대단하다.", "face": "웃음"}]}, {"id": "설정_실라스_겨울", "log": "광장의 늑대 음유시인이 떠돌이라는 걸 알았어요.", "cond": {"met": ["실라스"], "minAge": 10, "season": "가을", "notSeen": ["실라스A"]}, "pom": false, "lines": [{"who": "언니", "text": "광장에서 노래하던 늑대 있잖아, 오늘은 안 보이더라."}, {"who": "나비", "text": "실라스 아저씨? 떠돌이라서 겨울 오기 전엔 따뜻한 다른 마을로 간대.", "face": "기본"}, {"who": "언니", "text": "…그럼 봄이 되면 여기로 다시 와?"}, {"who": "나비", "text": "…그건 나도 몰라.", "face": "기본"}]}, {"id": "설정_실라스_울음", "log": "밤에 늑대 울음소리가 들렸어요.", "cond": {"met": ["실라스"], "minAge": 11, "maxAge": 14}, "pom": false, "lines": [{"who": "나비", "text": "언니, 어젯밤에 밖에서 길게 우우우~ 하는 소리 들었어? 그거 늑대 소리야.", "face": "놀람"}, {"who": "언니", "text": "나도 들었어. 동네에 민원을 넣어야 하나 잠깐 고민했는데."}, {"who": "나비", "text": "그거 실라스 아저씨야. 달이 밝으면 참을 수가 없대. 자기는 그게 노래라고 꼬리 치면서 우기더라구.", "face": "웃음"}, {"who": "언니", "text": "…아, 노래 수업료가 그래서 그렇게 비싼가.", "face": "웃음"}]}, {"id": "설정_헤이즐_동생", "log": "헤이즐네 동생 셋 이야기를 들었어요.", "cond": {"met": ["헤이즐"], "minAge": 10, "maxAge": 13}, "pom": false, "lines": [{"who": "나비", "text": "헤이즐은 밑으로 동생이 무려 셋이나 있어. 아침마다 셋 머리를 다 빗겨 주고 오느라 바쁘대.", "face": "기본"}, {"who": "언니", "text": "아, 그래서 늘 다른 애들보다 조금 늦는구나."}, {"who": "나비", "text": "응. 정작 자기 머리는 바빠서 못 빗어. 그래서 내가 빵집 뒷마당에서 빗겨 줬어!", "face": "웃음"}, {"who": "언니", "text": "(…내 머리도 네가 그렇게 예쁘게 빗겨 주더니.)", "face": "웃음", "inner": true}]}, {"id": "설정_루비_꽃가게", "log": "루비네 꽃 가게 이야기를 들었어요.", "cond": {"met": ["루비"], "minAge": 10, "maxAge": 13}, "pom": false, "lines": [{"who": "언니", "text": "아까 시장 꽃 가게 여우 아주머니가 네 얘기 하시더라. 루비랑 친한 친구지, 하고."}, {"who": "나비", "text": "그분 루비 엄마야. 그 가게에 있는 꽃 이름은 루비가 다 알아. 루비는 손님보다 꽃을 훨씬 더 좋아해.", "face": "기본"}, {"who": "언니", "text": "손님은 별로 안 좋아해?"}, {"who": "나비", "text": "응, 손님 오면 부끄러워서 뒤로 쏙 숨어. 그래서 내가 같이 가면 나를 앞에 떡하니 세워 둬.", "face": "웃음"}]}, {"id": "설정_몰리_할머니", "log": "몰리 할머니가 옛날에 유명한 화가였다는 걸 알았어요.", "cond": {"met": ["몰리"], "minAge": 10, "maxAge": 12}, "pom": false, "lines": [{"who": "나비", "text": "언니, 그림 수업 하시는 몰리 할머니 있잖아. 옛날엔 왕궁에 직접 그림 그리러 다녔대!", "face": "놀람"}, {"who": "언니", "text": "그 다정한 할머니가? 늘 옷가게 하시는 분이?"}, {"who": "나비", "text": "응. 몰리가 그러는데 할머니가 그린 커다란 그림이 아직도 왕궁에 걸려 있대. 그래서 몰리는 그 얘기만 나오면 부담스러운지 더 조용해져.", "face": "기본"}, {"who": "언니", "text": "(…어린 몰리한텐 그 그림이 엄청 무겁게 느껴지겠다.)", "inner": true}]}, {"id": "설정_카일_소문", "log": "뒷골목 아이 소문을 들었어요.", "cond": {"met": ["카일"], "minAge": 11, "maxAge": 13}, "pom": false, "lines": [{"who": "언니", "text": "빵집 아저씨가 그러는데, 밤마다 뒷골목에 날아다니는 박쥐 애가 하나 있대. 자꾸 빵이 없어진다고 하던데."}, {"who": "나비", "text": "…카일이야. 훔치는 거 절대 아니야. 바닥에 떨어진 것만 주워 가는 거야.", "face": "울먹"}, {"who": "언니", "text": "…네가 그 애를 어떻게 그렇게 잘 알아?"}, {"who": "나비", "text": "…", "face": "기본"}, {"who": "언니", "text": "(…요즘 그 골목 쪽에 자주 가더니.)", "ifFlag": "kyleMap", "elseText": "(…심부름 간다고 쫄래쫄래 가던 곳이 거기구나.)", "inner": true}]}, {"id": "설정_마을_마녀소문", "log": "마을 사람들이 언니를 어떻게 보는지 들었어요.", "cond": {"minAge": 10, "maxAge": 10}, "pom": false, "lines": [{"who": "언니", "text": "장을 보는데 사람들이 나를 자꾸 빤히 쳐다보더라. 눈 마주쳐서 인사하면 두 번씩 굽신거리고."}, {"who": "나비", "text": "언니가 죽다 살아나서 그렇대. 심지어 마녀라고 수군거리는 애도 있었는데 내가 다 때려줬어!", "face": "기본"}, {"who": "언니", "text": "…어?! 사람을 함부로 때리면 안 돼!"}, {"who": "나비", "text": "아, 진짜로 때린 거 아니고 말로 따끔하게 혼내준 거야.", "face": "웃음"}]}, {"id": "설정_엘리_습관", "log": "원래 언니가 늘 하던 일을 하나 알았어요.", "cond": {"minAge": 10, "maxAge": 11}, "pom": false, "lines": [{"who": "나비", "text": "언니, 오늘은 왜 아침 창문 안 열어? 매일 아침마다 꼭 열었잖아. 새들한테 빵 부스러기 주려고.", "face": "놀람"}, {"who": "언니", "text": "…어?! (…매일 아침, 새들한테 빵을 줬구나.)", "face": "가슴"}, {"who": "나비", "text": "저것 봐, 새들이 창틀에 옹기종기 앉아서 기다리잖아.", "face": "기본"}, {"who": "언니", "text": "…내일 아침부터는 꼭 다시 열자."}]}, {"id": "설정_큰나무_눈금", "log": "큰 나무의 눈금 이야기를 했어요.", "cond": {"minAge": 11, "maxAge": 12}, "pom": false, "lines": [{"who": "나비", "text": "언니, 별빛 언덕 나무에 그린 내 생일 눈금 밑에 아주 작은 거 하나 더 있던데. 그거 내 아홉 살 때 그은 거지?", "face": "기본"}, {"who": "언니", "text": "(…엘리가 새겨놓은 거구나.)", "inner": true}, {"who": "언니", "text": "응, 맞아. 아홉 살 때 그은 거."}, {"who": "나비", "text": "내년 생일엔 내가 언니 키도 잴게. 언니는 키가 하나도 안 크지만.", "face": "웃음"}]}, {"id": "설정_안개열", "log": "안개열이 어떤 병인지 들었어요.", "cond": {"minAge": 12, "maxAge": 14, "season": "겨울"}, "pom": false, "lines": [{"who": "나비", "text": "토르 선생님이 그러는데, 안개열은 주로 겨울에, 안개 짙은 날 돈대. 열이 펄펄 나다가 조용해지는 병이래.", "face": "기본"}, {"who": "언니", "text": "(…네가 사경을 헤맸던 병이구나.)", "face": "가슴", "inner": true}, {"who": "나비", "text": "나도 걸렸었잖아. 다 낫고 밤새 언니 손 잡고 있던 것만 기억나.", "face": "기본"}, {"who": "언니", "text": "…응, 그거면 충분해."}]}, {"id": "설정_축제_달력", "log": "포근숲 왕국의 축제를 알았어요.", "cond": {"minAge": 10, "maxAge": 11, "months": [3, 9]}, "pom": false, "lines": [{"who": "나비", "text": "언니, 다음 달이 마을 축제야! 봄엔 왁자지껄한 꽃축제 대회, 가을엔 먹을 게 널린 수확제 장터! 둘 다 꼭 나가야 해!", "face": "웃음"}, {"who": "언니", "text": "벌써 그렇게 됐어? 올해는 맨 앞자리에서 보자."}, {"who": "나비", "text": "응! 포근숲은 축제를 신나게 안 즐기면 겨울이 안 물러간다잖아. 오울 선생님이 맨날 하는 말!", "face": "웃음"}, {"who": "언니", "text": "(…내가 다니던 회사도 그런 말을 달고 살았는데.)", "inner": true}]}, {"id": "설정_수인_겉모습", "log": "포근숲 사람들은 겉모습이 어려 보인다는 걸 알았어요.", "cond": {"minAge": 12, "maxAge": 14}, "pom": false, "lines": [{"who": "나비", "text": "언니, 빵집 버니 요리사님이 나이가 엄청 많대. 근데 얼굴은 꼭 언니랑 비슷해 보이잖아.", "face": "놀람"}, {"who": "언니", "text": "포근숲 사람들은 마음이 늙어야 얼굴도 늙는다잖아. 버니 씨는 마음이 아직 젊으신 거지."}, {"who": "나비", "text": "맞아, 토르 선생님도 그랬어! 그럼 언니도 마음이 아직 아기야? 하나도 안 늙었잖아.", "face": "기본"}, {"who": "언니", "text": "(…그럼 수염 난 토르 씨는 속이 엄청 늙은 건가.)", "face": "웃음", "inner": true}]}, {"id": "설정_폼폼_겨울", "log": "폼폼이 겨울에 조금 작아진다는 걸 알았어요.", "cond": {"minAge": 10, "maxAge": 11, "season": "겨울"}, "pom": true, "lines": [{"who": "나비", "text": "언니, 폼폼이 눈 내리고 나서 좀 쪼그라든 것 같아. 내가 손가락으로 재 봤어.", "face": "놀람"}, {"who": "폼폼", "text": "겨울엔 추워서 홀씨를 몇 개 먼저 날려 보내거든. 봄바람 불면 다시 커지니까 걱정 마."}, {"who": "언니", "text": "폼폼이 겨울엔 원래 그렇다는데? …봄 되면 다시 둥실둥실 커진대."}, {"who": "나비", "text": "언니가 폼폼 말을 어떻게 알아들어?", "face": "놀람"}, {"who": "언니", "text": "…어?! (…앗, 큰일이다.)", "face": "가슴"}]}, {"id": "조각_길아는언니", "log": "언니가 처음 가는 길인데 발이 먼저 갔어요.", "cond": {"minAge": 10, "maxAge": 10}, "pom": false, "lines": [{"who": "언니", "text": "시장 가는 길, 오늘 분명 처음 갔는데 이상하게 발이 먼저 가더라. 골목 세 번째에서 꺾어지는 거."}, {"who": "나비", "text": "언니가 매일매일 장 보러 가던 익숙한 길이잖아. 뭘 새삼스럽게 처음이래.", "face": "웃음"}, {"who": "언니", "text": "…아, 그렇지. (…그런데 진짜 나는 처음인데.)", "face": "가슴"}, {"who": "나비", "text": "우리 언니, 아프고 나더니 자꾸 엉뚱한 소리를 많이 해.", "face": "웃음"}]}, {"id": "조각_폼폼_조용", "log": "폼폼이 어떤 얘기엔 조용해지는 걸 동생이 봤어요.", "cond": {"minAge": 12, "maxAge": 15}, "pom": true, "lines": [{"who": "나비", "text": "폼폼은 언니 아팠던 날 얘기만 나오면 빛이 작아져. 저것 봐, 지금도.", "face": "기본"}, {"who": "폼폼", "text": "…"}, {"who": "언니", "text": "(…진짜네. 엘리 얘기만 나오면 움츠러드네.)", "inner": true}, {"who": "나비", "text": "폼폼도 그날 열나는 언니 보고 많이 무서웠나 봐. 내가 꼭 안아 줄게.", "face": "웃음"}]}, {"id": "조각_휴고_브로치", "log": "휴고 장군이 브로치를 보고 말을 멈췼어요.", "cond": {"met": ["휴고"], "minAge": 13, "flags": ["brooch"]}, "pom": false, "lines": [{"who": "나비", "text": "오늘 장군님이 내 가슴에 단 브로치 보고 한참이나 입을 꾹 다물었어. 그러고선 고개를 저으며 '…아니다.' 했어.", "face": "놀람"}, {"who": "언니", "text": "다락방 상자에서 꺼낸 고양이 모양 그거?"}, {"who": "나비", "text": "응. 고양이 무늬가 예뻐서 당당하게 달고 갔는데. 장군님이 주머니에서 수첩을 꺼내려다 말았어.", "face": "기본"}, {"who": "언니", "text": "(…대체 수첩에 뭘 적으려던 거지.)", "inner": true}]}];/*LORE_END*/

  if ($('#scene').classList.contains('on') && !$('#home').classList.contains('on')) return;
  e.preventDefault();
  if ($('#confirm').classList.contains('on')) { $('#confirm').classList.remove('on'); return; }
  if ($('#placeBox').classList.contains('on')) { $('#placeBox').classList.remove('on','shop'); return; }
  if ($('#garden').classList.contains('on')) { if (gSel >= 0) { gSel = -1; renderGarden(); } else { $('#garden').classList.remove('on'); $('#shade').classList.remove('on'); } return; }
  for (const id of ['statPane','diary','out','settings','slots','bag','status']) { const el = $('#' + id); if (el && el.classList.contains('on')) { el.classList.remove('on'); $('#shade').classList.remove('on'); playBgm(seasonBgm()); return; } }
  if (e.target.closest && e.target.closest('#weeks')) return;
  if ($('#plan').classList.contains('on') && !$('#plan').classList.contains('res')) {
    const last = [3,2,1,0].find(k => plan[k]); if (last !== undefined) { plan[last] = null; week = last; renderPlan(); renderWeeks(); }
    else { $('#plan').classList.remove('on'); $('#shade').classList.remove('on'); playBgm(seasonBgm()); } return; }
});

// 화면이 아주 좁으면(휴대폰 세로) 대사창을 넓게. 게임 안에서는 한 번만 가로로 돌리라고 알려 줌
(function () { const st = $('#stage'); const f = () => { const nw = st.clientWidth < 520 && !st.classList.contains('tfull'); st.classList.toggle('narrow', nw);
    if (nw && !window._rotTip && !$('#title').classList.contains('on') && !location.hash.startsWith('#dev')) { window._rotTip = 1; setTimeout(() => toast('휴대폰을 가로로 돌리면 크게 보여요.'), 800); } };
  addEventListener('resize', f); new MutationObserver(f).observe($('#title'), { attributes:true, attributeFilter:['class'] }); new MutationObserver(f).observe(st, { attributes:true, attributeFilter:['class'] }); f(); })();
// 타이틀 배경: 타이틀_루프.mp4(있고 틀 수 있으면) → img/타이틀_시네마_가로·세로.jpg(있으면) → 지금 그림
(function () { const T = $('#title'), kv = T.querySelector('.bg.kv'), v = $('#tVid'), st = $('#stage'), port = matchMedia('(orientation:portrait)'), calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const base = kv.getAttribute('src'), cine = {};
  const pick = () => { const want = port.matches ? (cine.세로 || cine.가로) : cine.가로; if (kv.getAttribute('src') !== (want || base)) kv.setAttribute('src', want || base);
    T.classList.toggle('alt', !!want || T.classList.contains('vid')); T.classList.toggle('cineP', !!want && port.matches && want === cine.세로); };
  ['가로','세로'].forEach(k => { const im = new Image(); im.onload = () => { cine[k] = 'img/타이틀_시네마_' + k + '.jpg?v=1023'; pick(); }; im.src = 'img/타이틀_시네마_' + k + '.jpg?v=1023'; });
  if (!calm && !location.hash.startsWith('#dev')) { v.addEventListener('canplay', () => { v.play().then(() => { T.classList.add('vid','alt'); }).catch(() => {}); }, { once:true }); v.addEventListener('error', () => { T.classList.remove('vid'); pick(); }); v.src = '타이틀_루프.mp4?v=1023'; }
  const upd = () => { const on = T.classList.contains('on'); st.classList.toggle('tfull', on && port.matches && !document.querySelector('.pane.on, .endgal, #shade.on, #slots.on'));
    if (T.classList.contains('vid')) { if (on && v.paused) v.play().catch(() => {}); else if (!on && !v.paused) v.pause(); } };
  new MutationObserver(upd).observe(st, { subtree:true, childList:true, attributes:true, attributeFilter:['class'] }); port.addEventListener('change', () => { pick(); upd(); }); upd(); })();
// 타이틀: 홀씨 날리기 + 그림 속을 누르면 한마디
(function () {
  const box = document.querySelector('#title .seeds'); if (!box) return;
  for (let i = 0; i < 22; i++) { const d = document.createElement('i'); d.style.left = (Math.random() * 100) + '%'; d.style.top = (40 + Math.random() * 60) + '%';
    d.style.animationDelay = (-Math.random() * 14) + 's'; d.style.animationDuration = (9 + Math.random() * 8) + 's'; d.style.setProperty('--s', (.5 + Math.random() * .9)); box.appendChild(d); }
  const T = {
    hotTree: () => { const n = Object.keys(JSON.parse(localStorage.getItem('cat_endings') || '{}')).length; return n ? `눈금 ${n}개.` : '오래된 큰 나무.'; },
    hotPom: () => ['…안녕. 오늘도 왔네.', '나? 아마 그냥 홀씨일걸.', '저 아이가 기다리고 있어. 얼른 시작하자.'][Math.floor(Math.random() * 3)],
    hotTown: () => ['마을 불빛이 하나둘 켜져요.', '빵 굽는 냄새가 여기까지 와요.', '어디선가 류트 소리가 들려요.'][Math.floor(Math.random() * 3)] };
  Object.keys(T).forEach(id => { const el = document.getElementById(id); if (!el) return;
    el.onclick = e => { e.stopPropagation(); const b = $('#tBubble'); b.textContent = T[id](); b.style.left = el.style.left || getComputedStyle(el).left; b.style.top = `calc(${getComputedStyle(el).top} - 7cqh)`; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('on'), 2800); }; });
})();
